<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>拳皇 97 · 风云再起 (KOF'97 Fan Engine)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; background:#000; overflow:hidden;
    font-family: "Microsoft YaHei", "PingFang SC", monospace;
    color:#fff; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #wrap {
    position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 40%, #171b26 0%, #05060a 75%);
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 2px #1c2030, 0 0 60px rgba(60,90,160,.35), 0 24px 70px rgba(0,0,0,.8);
    background:#000;
  }
  #boot {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; z-index:20;
    background:rgba(0,0,0,.92); text-align:center;
  }
  #boot h1 {
    font-size:34px; letter-spacing:6px; font-weight:900;
    background:linear-gradient(180deg,#fff 0%,#ffd34d 45%,#e0430f 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 24px rgba(255,120,0,.35);
  }
  #boot p { font-size:13px; color:#9aa3b8; line-height:1.9; }
  #boot kbd {
    background:#232838; border:1px solid #3a4258; border-bottom-width:2px;
    border-radius:4px; padding:1px 6px; font-size:12px; color:#e6ecff;
  }
  #boot button {
    margin-top:6px; padding:12px 44px; font-size:16px; font-weight:800; letter-spacing:3px;
    color:#1a1005; cursor:pointer; border:none; border-radius:3px;
    background:linear-gradient(180deg,#ffe08a,#f0a11c 60%,#c96a06);
    box-shadow:0 3px 0 #7a3f02, 0 8px 24px rgba(255,140,0,.35);
  }
  #boot button:active { transform:translateY(2px); box-shadow:0 1px 0 #7a3f02; }
  #hint { position:absolute; left:10px; bottom:8px; font-size:11px; color:#4c5468; z-index:5; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="screen" width="320" height="224"></canvas>
    <div id="hint">F1 训练模式判定框 &nbsp;·&nbsp; F2 全屏 &nbsp;·&nbsp; F5 重开</div>
  </div>

  <div id="boot">
    <h1>拳 皇 97</h1>
    <p style="color:#cfd6e8;font-size:15px;letter-spacing:4px;margin-top:-8px;">THE KING OF FIGHTERS &nbsp;·&nbsp; 风云再起</p>
    <p>
      <b style="color:#ffd34d">1P</b>&nbsp;
      移动 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp;
      轻拳 <kbd>J</kbd> 轻脚 <kbd>K</kbd> 重拳 <kbd>U</kbd> 重脚 <kbd>I</kbd><br>
      <b style="color:#7fb3ff">2P</b>&nbsp;
      移动 <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> &nbsp;
      轻拳 <kbd>1</kbd> 轻脚 <kbd>2</kbd> 重拳 <kbd>4</kbd> 重脚 <kbd>5</kbd>（小键盘）<br>
      <span style="color:#7d8699">轻拳+轻脚 = 翻滚 / 受身&nbsp;&nbsp;·&nbsp;&nbsp;重拳+重脚 = 吹飞攻击&nbsp;&nbsp;·&nbsp;&nbsp;轻拳+轻脚+重拳 = MAX 爆气</span>
    </p>
    <button id="startBtn">START</button>
    <p style="font-size:11px;color:#5a6274;margin-top:4px;">同人自制引擎 · 非商用 · 无原版美术素材</p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
